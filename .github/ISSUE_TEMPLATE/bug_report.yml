name: Bug report
description: Report a problem with the DATALYR Node SDK.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Include the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest code sample that shows the problem. Remove API keys and personal data.
      render: javascript
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: "1.3.4"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system and hosting platform.
      placeholder: "Node 22, Linux, AWS Lambda"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: Set `debug: true` and paste the output. Remove API keys and personal data.
      render: text
