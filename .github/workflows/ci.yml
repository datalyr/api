name: CI

# Public repo: GitHub-hosted runners are free here, and fork PRs never run on
# paid (Blacksmith) machines. Fork PRs get a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same PR cancels the older run; each push to main keeps
# its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # tests/test.ts runs as TypeScript directly, which needs Node's type
        # stripping (on by default from 22.18).
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Package tarball for publishing off a laptop: `npm pack` (no prepack
      # script, so it packs the dist/ built above) plus its sha256. Once per
      # run (Node 24 leg), and not for fork PRs.
      - name: Pack tarball and checksum
        id: pack
        if: matrix.node == 24 && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p pack-out
          TARBALL="$(npm pack --pack-destination pack-out --silent | tail -n 1)"
          (cd pack-out && sha256sum "$TARBALL" > SHA256SUMS.txt)
          cat pack-out/SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload package artifact
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datalyr-api-${{ steps.pack.outputs.version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: pack-out/
          retention-days: 7
          if-no-files-found: error
